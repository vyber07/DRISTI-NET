services:
  nginx:
    # Behind a profile: its upstream resolver (127.0.0.11, Docker's embedded DNS) only works for
    # clients inside this compose network, and its 80:80 binding collides with a host nginx already
    # acting as the public entry point. Still available on hosts with no existing reverse proxy via
    # `docker compose --profile bundled-nginx up -d`.
    profiles:
    - bundled-nginx
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
    - 80:80
    volumes:
    - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - api
    healthcheck:
      test:
      - CMD-SHELL
      # DEF-103: 'localhost' resolves to ::1 in alpine while nginx listens on IPv4 only -> check never passed
      - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
  api:
    build: .
    restart: unless-stopped
    expose:
    - '8000'
    environment:
      DRISHTI_SECRET_KEY: ${DRISHTI_SECRET_KEY:?Set DRISHTI_SECRET_KEY in .env (min
        32 chars)}
      DRISHTI_SCANNER_MODE: auto
      DRISHTI_DATABASE_URL: postgresql+psycopg2://drishti:${POSTGRES_PASSWORD:?Set
        POSTGRES_PASSWORD in .env}@postgres:5432/drishti
      DRISHTI_NEO4J_URI: bolt://neo4j:7687
      DRISHTI_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      DRISHTI_S3_ENDPOINT_URL: http://minio:9000
      DRISHTI_S3_BUCKET: drishti
      DRISHTI_S3_ACCESS_KEY: drishti
      DRISHTI_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      DRISHTI_STORAGE_ROOT: /data
      DRISHTI_KAFKA_BOOTSTRAP_SERVERS: kafka:9092  # DEF-053: name the code reads
      DRISHTI_BESU_ENDPOINT: http://besu:8545
      DRISHTI_REDIS_URL: redis://redis:6379/0
      # Without these, config.py defaults to a single key derived from DRISHTI_SECRET_KEY, which
      # cannot verify any audit event signed before this key registry existed. Must be the SAME
      # values (not regenerated) as whatever deployment this one is migrated from, if any.
      DRISHTI_AUDIT_KEYS: ${DRISHTI_AUDIT_KEYS:?Set DRISHTI_AUDIT_KEYS in .env.compose (carry over unchanged from the prior deployment's .env, if migrating existing data)}
      DRISHTI_CURRENT_AUDIT_KEY_ID: ${DRISHTI_CURRENT_AUDIT_KEY_ID:?Set DRISHTI_CURRENT_AUDIT_KEY_ID in .env.compose (carry over unchanged)}
    volumes:
    - drishti-data:/data
    healthcheck:  # DEF-075: api had none; probe real readiness (DB + Neo4j), not just the port
      test:
      - CMD
      - python3
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=4).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      # BUG-NEW-14: Kafka and Besu are both optional, documented-degraded-path dependencies
      # (services/kafka_bus.py falls back to direct, synchronous pipeline processing when Kafka
      # is unavailable; integrity_routes.py simply skips the Besu ledger submission when it isn't
      # configured). service_started -- not service_healthy -- so an outage or slow-to-pass
      # healthcheck on either one never blocks the whole stack from starting.
      kafka:
        condition: service_started
      besu:
        condition: service_started
  postgres:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    # Run as postgres directly to bypass the root-to-postgres gosu transition.
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: drishti
    volumes:
    - drishti-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U drishti -d drishti
      interval: 5s
      timeout: 5s
      retries: 10
  neo4j:
    image: neo4j:5-community@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
    - drishti-neo4jdata:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O - http://localhost:7474 || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    # BLK-04: the pinned quay.io/minio digest (and :latest) no longer resolve; MinIO stopped publishing community images.
    # bitnamilegacy/minio is an obtainable S3-compatible build (own entrypoint, data in /bitnami/minio/data).
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: drishti
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
    - drishti-miniodata:/bitnami/minio/data
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9000/minio/health/ready
      interval: 5s
      timeout: 5s
      retries: 10
  clamav:
    image: clamav/clamav@sha256:9cb27d7660bdf66e9878c832cb433dd8aa152cfbe16f3c2c0084c80b04ae22b4
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - echo PING | nc localhost 3310 | grep -q PONG || exit 1  # DEF-075: require the PONG reply
      interval: 10s
      timeout: 5s
      retries: 20
  migrations:
    build: .
    restart: 'no'
    command:
    - python3
    - -m
    - apps.api.app.migrations
    environment:
      DRISHTI_DATABASE_URL: postgresql+psycopg2://drishti:${POSTGRES_PASSWORD:?Set
        POSTGRES_PASSWORD in .env}@postgres:5432/drishti
      # DEF-052: config's production guard rejects the default key on import, so without this the migrations
      # service exited non-zero and api/worker (service_completed_successfully) never started.
      DRISHTI_SECRET_KEY: ${DRISHTI_SECRET_KEY:?Set DRISHTI_SECRET_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    restart: unless-stopped
    command:
    - python3
    - -m
    - workers.worker
    environment:
      DRISHTI_SECRET_KEY: ${DRISHTI_SECRET_KEY:?Set DRISHTI_SECRET_KEY in .env}
      DRISHTI_DATABASE_URL: postgresql+psycopg2://drishti:${POSTGRES_PASSWORD:?Set
        POSTGRES_PASSWORD in .env}@postgres:5432/drishti
      DRISHTI_NEO4J_URI: bolt://neo4j:7687
      DRISHTI_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      DRISHTI_S3_ENDPOINT_URL: http://minio:9000
      DRISHTI_S3_BUCKET: drishti
      DRISHTI_S3_ACCESS_KEY: drishti
      DRISHTI_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      DRISHTI_STORAGE_ROOT: /data
      DRISHTI_KAFKA_BOOTSTRAP_SERVERS: kafka:9092  # DEF-053: name the code reads
      DRISHTI_BESU_ENDPOINT: http://besu:8545
      # Must match the api service's keys exactly (see its environment block) -- the worker signs
      # audit events for scan results and must sign under the same key registry the api verifies.
      DRISHTI_AUDIT_KEYS: ${DRISHTI_AUDIT_KEYS:?Set DRISHTI_AUDIT_KEYS in .env.compose (carry over unchanged from the prior deployment's .env, if migrating existing data)}
      DRISHTI_CURRENT_AUDIT_KEY_ID: ${DRISHTI_CURRENT_AUDIT_KEY_ID:?Set DRISHTI_CURRENT_AUDIT_KEY_ID in .env.compose (carry over unchanged)}
    volumes:
    - drishti-data:/data
    depends_on:
      clamav:
        condition: service_healthy  # DEF-075: the worker runs the scan gate
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:  # BUG-NEW-14: optional, see the matching comment on the api service above
        condition: service_started
      besu:
        condition: service_started
  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    # BLK-04: bitnami/kafka:3.5 is no longer published; bitnamilegacy carries the same image (same KAFKA_CFG_* settings).
    image: bitnamilegacy/kafka:3.5@sha256:a88197701b03bcf512bd8388dfd908dc705e76887d5d411583fd1cad51c49044
    restart: unless-stopped
    environment:
      KAFKA_ENABLE_KRAFT: 'yes'
      KAFKA_CFG_NODE_ID: '1'
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    volumes:
    - drishti-kafkadata:/bitnami/kafka
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
  besu:
    image: hyperledger/besu:24.1@sha256:f72c0ffbc66dacf04eace7f3d7e7edc550a074b97f8c9a4e3826465ed2d430b6
    restart: unless-stopped
    command:
    - --network=dev
    - --rpc-http-enabled
    - --rpc-http-host=0.0.0.0
    - --rpc-http-api=ETH,NET,WEB3  # DEF-075: DEBUG/MINER not needed to anchor a root
    - --host-allowlist=besu,localhost
    expose:
    - '8545'
    volumes:
    - drishti-besudata:/opt/besu/data
    healthcheck:
      test:
      # DEF-103: the besu image has no wget/curl/nc, so the old check could never pass (found by running the stack).
      # /dev/tcp needs bash (CMD-SHELL is /bin/sh = dash); probe Besu's /liveness endpoint, healthy only on HTTP 200.
      - CMD
      - bash
      - -c
      - "exec 3<>/dev/tcp/127.0.0.1/8545 && printf 'GET /liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  drishti-data: null
  drishti-pgdata: null
  drishti-neo4jdata: null
  drishti-miniodata: null
  drishti-kafkadata: null
  drishti-besudata: null
