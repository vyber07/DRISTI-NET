events {}
http {
  # After the switch: the old origin (127.0.0.1) 301-redirects every request to a different origin (localhost),
  # exactly like the live http://65.0.102.181 -> https://65.0.102.181.nip.io redirect added on 2026-11-11.
  server {
    listen 8020;
    if ($host = "127.0.0.1") { return 301 http://localhost:8020$request_uri; }
    location / { proxy_pass http://127.0.0.1:8016; proxy_set_header Host $host; }
  }
}
