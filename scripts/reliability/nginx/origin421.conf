events {}
http {
  # The recommended host-nginx change (infrastructure/nginx/canonical-origin.conf) applied to the test origin:
  # page loads on the old origin still 301 to the canonical one, but API calls get a same-origin JSON 421 the
  # client can read and act on, instead of a cross-origin 301 that the browser blocks as "Failed to fetch".
  server {
    listen 8020;
    location /api/ {
      default_type application/json;
      if ($host = "127.0.0.1") {
        return 421 '{"detail":"This address has moved. Continue at http://localhost:8020","code":"ORIGIN_MOVED","location":"http://localhost:8020"}';
      }
      proxy_pass http://127.0.0.1:8016; proxy_set_header Host $host;
    }
    location / {
      if ($host = "127.0.0.1") { return 301 http://localhost:8020$request_uri; }
      proxy_pass http://127.0.0.1:8016; proxy_set_header Host $host;
    }
  }
}
