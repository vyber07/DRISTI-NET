[tool.ruff]
# Apply to the Python application code only. Scripts and stubs are more lenient.
include = ["apps/api/**/*.py"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start with a focused ruleset and expand over time.
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = flake8-bugbear, C4 = flake8-comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    # B008: function calls in default arg (FastAPI Depends pattern — this is intentional)
    "B008",
    # E501: line too long (some existing docstrings and SQL fragments exceed 120 chars; fix incrementally)
    "E501",
    # UP007: use X | Y for union (Python 3.10+ syntax — project already uses it; keep for < 3.10 compat comments)
    "UP007",
]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.mypy]
python_version = "3.11"
# Strict settings on new code only. Existing code is excluded until it has type annotations.
files = [
    "apps/api/app/core/",
    "apps/api/app/services/evidence_service.py",
    "apps/api/app/services/graph_analytics.py",
]
strict = true
# Allow untyped external libraries (sqlalchemy, fastapi, networkx have incomplete stubs)
ignore_missing_imports = true
