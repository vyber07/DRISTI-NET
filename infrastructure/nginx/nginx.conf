# DRISHTI-NET nginx reverse-proxy configuration
# Listens on port 80; forwards all traffic to the API container on port 8000.
# The API container serves both /api/v1/* and the pre-built React SPA from /.
#
# Design notes:
# - client_max_body_size matches DRISHTI_MAX_UPLOAD_MB default (25 MB) + headroom.
# - proxy_read_timeout is generous (130s) to accommodate the ClamAV scan gate which
#   may take up to SCAN_TIMEOUT_S=120 on large files (config.py).
# - Security headers follow OWASP guidance. IMPORTANT: nginx add_header inheritance
#   rule — if a location block contains ANY add_header directive it no longer inherits
#   from the server{} block. Every location that needs security headers must include
#   them explicitly. We use a common snippet via include files approach, but since
#   include syntax for variables is complex, we inline per location instead.
# - /docs and /redoc get a relaxed CSP that allows cdn.jsdelivr.net (Swagger/ReDoc CDN).
# - React SPA / gets the strict self-only CSP.
# - gzip is enabled for API JSON and static assets to reduce transfer size.
# - Access logs use a structured format that includes upstream response time.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log with upstream timing
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;   # Do not advertise nginx version

    # Gzip for API JSON responses and React static assets
    gzip              on;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/javascript application/json
                      application/x-javascript text/javascript text/xml application/xml
                      application/xml+rss image/svg+xml;
    gzip_vary         on;
    gzip_proxied      any;

    # Upstream: the FastAPI container (uvicorn) inside the compose network
    upstream drishti_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;   # Accept any hostname / bare IP

        # Upload size: 30 MB (25 MB DRISHTI limit + multipart overhead)
        client_max_body_size  30m;

        # Allow the ClamAV scan gate to complete within its configured timeout
        proxy_read_timeout  130s;
        proxy_connect_timeout  10s;
        proxy_send_timeout  130s;

        # Common proxy headers — set at server level, inherited by all locations
        # that do NOT override them. Locations that add any add_header directive
        # must repeat these manually (nginx inheritance rule).
        proxy_set_header  Host               $http_host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_http_version  1.1;
        proxy_set_header  Connection         "";   # Enable upstream keepalive

        # ---------------------------------------------------------------
        # --- API routes (/api/*) — strict CSP, no special relaxation ---
        # ---------------------------------------------------------------
        location /api/ {
            proxy_pass  http://drishti_api;
            add_header  X-Content-Type-Options  "nosniff"   always;
            add_header  X-Frame-Options         "SAMEORIGIN" always;
            add_header  X-XSS-Protection        "1; mode=block" always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        }

        # ---------------------------------------------------------------
        # --- OpenAPI docs — relaxed CSP for cdn.jsdelivr.net (Swagger/ReDoc) ---
        # FastAPI's /docs and /redoc load JS/CSS from cdn.jsdelivr.net and
        # fastapi.tiangolo.com. Without this relaxation the browser blocks
        # those CDN assets and shows a blank white page.
        # ---------------------------------------------------------------
        location ~ ^/(docs|redoc|openapi\.json|docs/oauth2-redirect)$ {
            proxy_pass  http://drishti_api;
            add_header  X-Content-Type-Options  "nosniff"   always;
            add_header  X-Frame-Options         "SAMEORIGIN" always;
            add_header  X-XSS-Protection        "1; mode=block" always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none';" always;
        }

        # ---------------------------------------------------------------
        # --- React SPA static assets — immutable long-term cache ---
        # Content-hash filenames (Vite default) guarantee cache-busting on rebuild.
        # ---------------------------------------------------------------
        location /assets/ {
            proxy_pass  http://drishti_api;
            add_header  Cache-Control           "public, max-age=31536000, immutable" always;
            add_header  X-Content-Type-Options  "nosniff"   always;
            add_header  X-Frame-Options         "SAMEORIGIN" always;
            add_header  X-XSS-Protection        "1; mode=block" always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        }

        # ---------------------------------------------------------------
        # --- React SPA (catch-all) — strict CSP, no-cache on index.html ---
        # Client-side router (React Router) handles all non-asset paths.
        # ---------------------------------------------------------------
        location / {
            proxy_pass  http://drishti_api;
            add_header  Cache-Control           "no-store, no-cache, must-revalidate" always;
            add_header  X-Content-Type-Options  "nosniff"   always;
            add_header  X-Frame-Options         "SAMEORIGIN" always;
            add_header  X-XSS-Protection        "1; mode=block" always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        }
    }
}
