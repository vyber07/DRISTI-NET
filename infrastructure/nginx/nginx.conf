# DRISHTI-NET nginx reverse-proxy configuration
# Listens on port 80; forwards all traffic to the API container on port 8000.
# The API container serves both /api/v1/* and the pre-built React SPA from /.
#
# Design notes:
# - client_max_body_size matches DRISHTI_MAX_UPLOAD_MB default (25 MB) + headroom.
# - proxy_read_timeout is generous (120s) to accommodate the ClamAV scan gate which
#   may take up to SCAN_TIMEOUT_S=120 on large files (config.py).
# - Security headers follow OWASP guidance; X-Frame-Options prevents clickjacking.
# - gzip is enabled for API JSON and static assets to reduce transfer size.
# - Access logs use a structured format that includes upstream response time.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log with upstream timing
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;   # Do not advertise nginx version

    # Gzip for API JSON responses and React static assets
    gzip              on;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/javascript application/json
                      application/x-javascript text/javascript text/xml application/xml
                      application/xml+rss image/svg+xml;
    gzip_vary         on;
    gzip_proxied      any;

    # Upstream: the FastAPI container (uvicorn) inside the compose network
    upstream drishti_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;   # Accept any hostname / bare IP

        # Upload size: 30 MB (25 MB DRISHTI limit + multipart overhead)
        client_max_body_size  30m;

        # Allow the ClamAV scan gate to complete within its configured timeout
        proxy_read_timeout  130s;
        proxy_connect_timeout  10s;
        proxy_send_timeout  130s;

        # Security headers
        add_header  X-Content-Type-Options   "nosniff"          always;
        add_header  X-Frame-Options          "SAMEORIGIN"       always;
        add_header  X-XSS-Protection         "1; mode=block"    always;
        add_header  Referrer-Policy          "strict-origin-when-cross-origin" always;
        # CSP: allow fonts from Google Fonts (used by the React UI) and the API itself.
        # Note: nginx add_header values must be on a single line.
        add_header  Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # Common proxy headers — preserve client IP through the proxy
        proxy_set_header  Host               $http_host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;
        proxy_http_version  1.1;
        proxy_set_header  Connection         "";   # Enable upstream keepalive

        # --- API routes ---
        location /api/ {
            proxy_pass  http://drishti_api;
        }

        # --- OpenAPI docs (FastAPI built-in) ---
        location ~ ^/(docs|redoc|openapi.json)$ {
            proxy_pass  http://drishti_api;
        }

        # --- React SPA static assets (long-term cache via content-hash filenames) ---
        location /assets/ {
            proxy_pass            http://drishti_api;
            proxy_cache_valid     200 1y;
            add_header            Cache-Control "public, max-age=31536000, immutable" always;
            # Keep security headers on asset responses too
            add_header  X-Content-Type-Options  "nosniff"    always;
            add_header  X-Frame-Options         "SAMEORIGIN" always;
        }

        # --- React SPA — everything else is the index page (client-side routing) ---
        location / {
            proxy_pass  http://drishti_api;
            # Do not cache the HTML shell — it changes on rebuild
            add_header  Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }
}
