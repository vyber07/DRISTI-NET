# Recommended host-nginx server blocks for the public demo (docs/TROUBLESHOOTING.md, "Failed to fetch after the
# HTTPS switch"). NOT applied automatically: review, adapt the names, `sudo nginx -t`, then `sudo systemctl reload nginx`.
#
# Problem: on 2026-11-11 http://65.0.102.181 started answering every request with
#   301 -> https://65.0.102.181.nip.io$request_uri
# A browser tab already open on the old address keeps calling /api/v1/... on that address. fetch() follows the 301
# to a different origin, the API's response carries no CORS headers, and the browser rejects it as
# "TypeError: Failed to fetch" -- the app cannot read the redirect or explain it.
#
# Fix: keep the 301 for page loads (a full navigation is allowed to change origin), but answer API calls on a
# non-canonical address with a same-origin JSON 421. The web client (real_client.ts) reads code ORIGIN_MOVED and
# moves the tab to the canonical origin, where the officer signs in again (sessions are per origin).

# --- old address, plain HTTP (replaces the current `return 301` server on port 80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 65.0.102.181 65.0.102.181.nip.io;

    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 421 '{"detail":"DRISTI-NET has moved to https://65.0.102.181.nip.io. Please continue there.","code":"ORIGIN_MOVED","location":"https://65.0.102.181.nip.io"}';
    }
    location / {
        return 301 https://65.0.102.181.nip.io$request_uri;
    }
}

# --- bare IP over HTTPS: today the 443 default_server serves another application here. If DRISTI-NET should own
# that address instead, add the same two locations to that server block (certificate permitting); otherwise leave it.
